<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fairway Tales</title>
<meta name="description" content="A top-down golf RPG. Swipe to swing, collect clubs, beat rivals.">
<meta name="theme-color" content="#0e1d15">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* page frame (what the artifact viewer normally supplies) */
*,*::before,*::after{box-sizing:border-box}
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap">
<style>
/* Layout: one-screen game column - HUD strip, course canvas, club row, swing pad, swing log */
:root{
  --ink:#0e1d15; --panel:#15291f; --panel2:#1c3628; --line:#2d5141;
  --chalk:#eef3e4; --muted:#97b3a1; --flag:#f2c14e; --hazard:#ec7a55; --good:#8fd88a;
  --display:'Lilita One','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--chalk);font-family:var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.hud{display:flex;align-items:center;gap:12px}
.hole{flex:1;min-width:0}
.hname{font-family:var(--display);font-size:20px;letter-spacing:.3px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmeta{color:var(--muted);font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmeta b{color:var(--chalk)}
.hlinks{display:flex;gap:10px;font-size:12px;margin-top:2px;flex-wrap:wrap;row-gap:0}
.hlinks .link{padding-block:2px}
.stat,.wind{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 10px;display:flex;align-items:center;gap:6px}
.stat{flex-direction:column;gap:0;min-width:56px}
.k{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:800}
.v{font-family:var(--display);font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.wind svg{width:26px;height:26px;fill:var(--chalk);transition:transform .4s}
.wind div{display:flex;flex-direction:column;align-items:flex-start}
.stage{position:relative;flex:1;min-height:0;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#1d3b26}
#course{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.chips{position:absolute;left:8px;top:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.chip{background:rgba(14,29,21,.78);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.toast{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(14,29,21,.88);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;line-height:1.35;pointer-events:none}
.toast b{color:var(--flag)}
.stage.has-spin .toast{right:104px}
.spin{position:absolute;right:8px;bottom:8px;width:88px;display:flex;flex-direction:column;align-items:center;gap:3px}
.spin svg{width:88px;height:88px;touch-action:none;cursor:grab;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.spl{background:rgba(14,29,21,.85);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800;white-space:nowrap}
.end{position:absolute;inset:0;z-index:5;background:rgba(10,22,15,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:16px;overflow-y:auto}
.end .big{font-family:var(--display);font-size:44px;color:var(--flag);line-height:1}
.end .sub{color:var(--muted);font-weight:700}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.btn{font-family:var(--display);font-size:18px;background:var(--flag);color:#1d1a0e;border:0;border-radius:12px;padding:10px 22px;cursor:pointer}
.btn.alt{background:transparent;color:var(--chalk);border:1px solid var(--line)}
.btn:focus-visible,.cbtn:focus-visible,.ghost:focus-visible,.link:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.card-wrap{max-width:100%;overflow-x:auto;margin-top:8px}
table.card{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px;font-weight:800}
table.card th,table.card td{padding:5px 0;width:30px;text-align:center;border-bottom:1px solid var(--line)}
table.card th{color:var(--muted);font-size:11px;text-align:left;width:44px;padding-right:6px}
table.card td.tot{width:40px;color:var(--flag)}
table.card tr.now td.cur{outline:1px solid var(--flag);outline-offset:-3px;border-radius:6px}
.sc{display:inline-grid;place-items:center;width:22px;height:22px}
.sc.u{border:1.5px solid var(--good);border-radius:50%;color:var(--good)}
.sc.uu{border:3px double var(--good);border-radius:50%;color:var(--good)}
.sc.o{border:1.5px solid var(--hazard);border-radius:3px;color:var(--hazard)}
.sc.oo{border:3px double var(--hazard);border-radius:3px;color:var(--hazard)}
.clubrow{display:flex;align-items:center;gap:8px}
.cbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--chalk);font-size:22px;font-weight:800;cursor:pointer}
.club{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px 12px;min-height:44px}
#clubName{font-family:var(--display);font-size:16px;line-height:1.15;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#clubCarry{flex:none;color:var(--muted);font-weight:800;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.link{background:none;border:0;padding:0;color:var(--flag);font:inherit;font-weight:800;cursor:pointer}
.ghost{height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:800;font-size:12px;padding:0 10px;cursor:pointer}
.ghost[aria-pressed="true"]{background:var(--flag);color:#1d1a0e;border-color:var(--flag)}
.ghost:disabled{opacity:.35;cursor:default}
.pad{position:relative;height:clamp(170px,30vh,230px);flex:none;border-radius:16px;background:var(--panel2);border:1px solid var(--line);touch-action:none;overflow:hidden}
.pad.cancel{border-color:var(--hazard);background:#3a231f}
#padcv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:var(--muted);font-weight:800;font-size:14px;letter-spacing:.4px;pointer-events:none}
.read{position:absolute;left:14px;top:10px;font-family:var(--display);font-size:30px;pointer-events:none;font-variant-numeric:tabular-nums}
.log{font-size:12px;color:var(--muted);font-weight:700;min-height:16px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log b{color:var(--chalk)}
button.club{font:inherit;color:inherit;text-align:left;cursor:pointer;overflow:hidden}
.sheet{position:fixed;inset:0;z-index:20;background:var(--ink);display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.sheet>*{width:100%;max-width:560px;margin-inline:auto}
.sheet-head{display:flex;align-items:center;gap:10px}
.sheet-title{font-family:var(--display);font-size:26px;flex:1}
.wallet{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:inherit;font-weight:800;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--flag);color:#1d1a0e;border-color:var(--flag)}
.sheet-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:20px;overscroll-behavior:contain}
.group-h{font-family:var(--display);font-size:16px;color:var(--muted);margin-top:4px}
.cc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.cc.locked{opacity:.6}
.cc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cc-name{font-family:var(--display);font-size:19px;flex:1;min-width:0}
.rar{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.lvrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.lvrow .lv{font-family:var(--display);font-size:16px;min-width:44px}
.bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.bar.cap i{background:var(--flag)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.st{display:grid;grid-template-columns:76px 1fr 22px;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.st .bar{height:6px}.st .bar i{background:var(--chalk)}
.st b{color:var(--chalk);text-align:right}
.perk{font-size:12px;font-weight:700;color:var(--flag)}
.blurb{font-size:12px;color:var(--muted);font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--chalk);font:inherit;font-weight:800;font-size:13px;padding:0 12px;cursor:pointer}
.sbtn.pri{background:var(--flag);color:#1d1a0e;border-color:var(--flag)}
.sbtn:disabled{opacity:.4;cursor:default}
.swap{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.swap-row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800}
.swap-row span{flex:1}
.reward{color:var(--flag);font-weight:800}
/* story overworld */
.world{position:fixed;inset:0;z-index:18;background:#2c5a33;overflow:hidden;touch-action:none}
#wcv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.wtop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:10px;
  background:linear-gradient(rgba(14,29,21,.88),rgba(14,29,21,0));pointer-events:none}
.wtop>*{pointer-events:auto}
.wloc{flex:1;min-width:0;pointer-events:none}
.wname{font-family:var(--display);font-size:20px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.wtop .ghost{background:rgba(14,29,21,.75);color:var(--chalk);height:38px}
.wgoal{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(64px + env(safe-area-inset-top,0px));max-width:calc(100% - 32px);
  background:rgba(14,29,21,.82);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:12px;font-weight:800;pointer-events:none}
.wgoal b{color:var(--flag)}
.wtalk{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));
  font-family:var(--display);font-size:20px;background:var(--flag);color:#1d1a0e;border:0;border-radius:999px;padding:12px 26px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlg{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));
  max-width:560px;margin:0 auto;background:rgba(14,29,21,.95);border:2px solid var(--line);border-radius:18px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.45)}
.dlg-who{display:flex;align-items:center;gap:8px}
.dlg-who b{font-family:var(--display);font-weight:400;font-size:19px;color:var(--flag)}
.face{width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,0,0,.35);flex:none}
.dlg-text{font-size:16px;font-weight:700;line-height:1.45;min-height:46px}
.dlg-text.narr{color:var(--muted);font-style:italic}
.dlg-ch{display:flex;flex-direction:column;gap:6px}
.dlg-ch button{min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--chalk);font:inherit;font-weight:800;font-size:15px;text-align:left;padding:8px 14px;cursor:pointer}
.dlg-ch button:first-child{background:var(--flag);color:#1d1a0e;border-color:var(--flag)}
.dlg-more{align-self:flex-end;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
/* menu & pass and play */
.menu{z-index:30;overflow-y:auto}
.menu-body{display:flex;flex-direction:column;gap:10px;padding-bottom:20px}
.menu-hero{display:flex;flex-direction:column;gap:4px;padding-block:18px 8px}
.menu-title{font-family:var(--display);font-size:46px;line-height:.95;color:var(--chalk)}
.menu-title span{color:var(--flag)}
.mbtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--chalk);font:inherit;cursor:pointer}
.mbtn b{font-family:var(--display);font-weight:400;font-size:22px}
.mbtn span{font-size:13px;color:var(--muted);font-weight:700}
.mbtn.pri{background:var(--flag);border-color:var(--flag);color:#1d1a0e}
.mbtn.pri span{color:#4a3f17}
.mbtn:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.bk{width:100%;min-height:84px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--chalk);font:12px/1.4 ui-monospace,Menlo,monospace;padding:10px;resize:vertical;word-break:break-all}
.screen-h{display:flex;align-items:center;gap:10px;padding-top:8px}
.screen-h .sheet-title{flex:1}
.seg{display:flex;gap:6px}
.seg button{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-family:var(--display);font-size:20px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--flag);color:#1d1a0e;border-color:var(--flag)}
.prow{display:flex;align-items:center;gap:10px}
.dot{width:22px;height:22px;border-radius:50%;flex:none;border:2px solid rgba(0,0,0,.35)}
.prow input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--chalk);font:inherit;font-weight:800;font-size:16px;padding:0 12px}
.prow input:focus{outline:2px solid var(--flag);outline-offset:1px}
.hrow{display:flex;align-items:center;gap:10px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--chalk);font:inherit;cursor:pointer;text-align:left}
.hrow .n{font-family:var(--display);font-size:22px;width:28px;color:var(--flag)}
.hrow .t{flex:1;font-weight:800}
.hrow .m{color:var(--muted);font-size:12px;font-weight:800}
.pass{position:fixed;inset:0;z-index:25;background:rgba(10,22,15,.94);display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.pass-card{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.pass-ball{width:56px;height:56px;border-radius:50%;border:3px solid rgba(0,0,0,.4);box-shadow:0 4px 14px rgba(0,0,0,.4)}
.pass-name{font-family:var(--display);font-size:38px;line-height:1}
.standings{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:4px}
.who{display:inline-flex;align-items:center;gap:6px}
.who i{width:10px;height:10px;border-radius:50%;display:inline-block}
table.card th.pn{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:420px){.stats{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.wind svg{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="hole">
      <div id="hname" class="hname">Hole 1 · The Spinney</div>
      <div class="hmeta">Par <span id="par">4</span> · <span id="len">385</span> yds · <b id="total">E</b></div>
      <div class="hlinks"><button id="menuBtn" class="link">Menu</button><button id="bagBtn" class="link">Bag</button><button id="cardBtn" class="link">Card</button><button id="reset" class="link">Restart</button></div>
    </div>
    <div class="stat"><span class="k">Stroke</span><span id="stroke" class="v">1</span></div>
    <div class="wind" title="Wind">
      <svg id="windArrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L19 11 H14.5 V22 H9.5 V11 H5 Z"/></svg>
      <div><span id="windMph" class="v">0</span><span class="k">mph</span></div>
    </div>
  </header>

  <div class="stage">
    <canvas id="course" aria-label="Golf hole. Drag to aim."></canvas>
    <div class="chips"><span id="who" class="chip who" hidden></span><span id="lie" class="chip">Tee</span><span id="topin" class="chip">385 yds to pin</span><span id="slope" class="chip" hidden></span></div>
    <div id="toast" class="toast" hidden></div>
    <div id="spin" class="spin">
      <svg viewBox="-50 -50 100 100" aria-label="Strike point. Drag to add loft, spin and shape. Double-tap to centre.">
        <defs><radialGradient id="ballG" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#e4e9df"/><stop offset="1" stop-color="#aeb8aa"/></radialGradient></defs>
        <circle r="46" fill="url(#ballG)" stroke="#0e1d15" stroke-width="2"/>
        <g fill="#c9d2c4"><circle cx="-18" cy="-22" r="3"/><circle cx="20" cy="-18" r="3"/><circle cx="-26" cy="14" r="3"/><circle cx="24" cy="20" r="3"/><circle cx="2" cy="30" r="3"/><circle cx="0" cy="-32" r="2.5"/></g>
        <g stroke="#7c8a78" stroke-width="1.2" stroke-dasharray="3 3"><line x1="-40" y1="0" x2="40" y2="0"/><line x1="0" y1="-40" x2="0" y2="40"/></g>
        <g font-family="Nunito Sans,system-ui,sans-serif" font-weight="800" font-size="9" fill="#55634f" text-anchor="middle"><text y="-36">TOP</text><text y="43">BACK</text><text x="-37" y="3">D</text><text x="37" y="3">F</text></g>
        <circle id="spDot" cx="0" cy="0" r="8" fill="#ec7a55" stroke="#ffffff" stroke-width="2.5"/>
      </svg>
      <div id="spinLabel" class="spl">Centre</div>
    </div>
    <div id="end" class="end" hidden></div>
  </div>

  <div class="clubrow">
    <button id="prev" class="cbtn" aria-label="Previous club">‹</button>
    <button id="clubBtn" class="club" aria-label="Open your bag"><span id="clubName">Driver</span><span id="clubCarry">250 yds</span></button>
    <button id="next" class="cbtn" aria-label="Next club">›</button>
    <button id="preview" class="ghost" aria-pressed="true" hidden>Preview</button>
    <button id="undo" class="ghost" disabled>Undo</button>
  </div>

  <div id="pad" class="pad" aria-label="Swing pad">
    <canvas id="padcv"></canvas>
    <div id="padHint" class="hint">Swipe down · pause · swipe up</div>
    <div id="padRead" class="read"></div>
  </div>
  <div id="log" class="log">Drag anywhere on the course to nudge your aim, or tap to jump it.</div>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-head">
    <div class="sheet-title">Your bag</div>
    <div class="wallet"><span class="chip"><span id="coins">0</span> coins</span><span class="chip"><span id="kits">0</span> kits</span></div>

let sd=11; const rnd=()=>{sd=(sd*16807)%2147483647;return (sd-1)/2147483646};
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};

// Build each hole's trees, centre line and yardage stakes once (seeded, so every round looks the same)
HOLES.forEach((h,hi)=>{

  for(const [n0,x0,x1,y0,y1,r0,r1] of h.trees){let n=n0,tries=0;while(n>0&&tries++<900){
    const t={x:x0+rnd()*(x1-x0),y:y0+rnd()*(y1-y0),r:r0+rnd()*(r1-r0)};
    if(polyDist(t.x,t.y,h.fw)<h.hw+t.r+3||inEll(t.x,t.y,h.green,1.7)||(t.y<16&&Math.abs(t.x)<22))continue;

    if(h.treesList.some(o=>Math.hypot(o.x-t.x,o.y-t.y)<(o.r+t.r)*.7))continue;h.treesList.push(t);n--;}}

  for(let i=0;i<P.length-1;i++){const[a,b]=[P[i],P[i+1]];const L=Math.hypot(b[0]-a[0],b[1]-a[1]);for(let s=0;s<L;s+=1)h.cl.push({x:a[0]+(b[0]-a[0])*s/L,y:a[1]+(b[1]-a[1])*s/L})}
  h.cl.push({x:h.green.x,y:h.green.y}); h.len=h.cl.length-1;

});

let H=HOLES[0];
function surfaceAt(x,y){

  if(x<B.x0||x>B.x1||y<B.y0||y>B.y1)return 'ob';
  for(const w of H.water)if(inEll(x,y,w))return 'water';
  for(const b of H.bunkers)if(inEll(x,y,b))return 'sand';
  if(inEll(x,y,H.green))return 'green';
  if(inEll(x,y,H.green,1.28))return 'fringe';
  if(x>=TEE.x0&&x<=TEE.x1&&y>=TEE.y0&&y<=TEE.y1)return 'tee';
  if(polyDist(x,y,H.fw)<=H.hw)return 'fairway';
  for(const t of H.treesList)if(Math.hypot(x-t.x,y-t.y)<t.r*.85)return 'trees';
  return 'rough';
}
// Green slope as acceleration (yd/s²), pointing downhill
function slope(x,y){const G=H.green,u=(x-G.x)/G.rx,v=(y-G.y)/G.ry;return{x:H.sl.x+H.sl.a*Math.sin(v*2.2),y:H.sl.y+H.sl.b*u}}

const rollMult=()=>{const f=spinF();return SP.y>=0?1+.8*SP.y*f:1+1.6*SP.y*f};
let best=null; try{best=+localStorage.getItem('fsl-best-round')||null}catch(e){}
const cam={x:20,y:190,s:2};

const toPar=n=>n===0?'E':n>0?`+${n}`:`${n}`;
const playedPar=()=>scores.reduce((a,s,i)=>a+(s?HOLES[i].par:0),0);
const playedStrokes=()=>scores.reduce((a,s)=>a+(s||0),0);

function loadHole(i){
  holeIdx=i; H=HOLES[i];
  const a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random())*.6;
  PIN={x:H.green.x+Math.cos(a)*r*H.green.rx,y:H.green.y+Math.sin(a)*r*H.green.ry};
  const wa=Math.random()*Math.PI*2, ws=Math.round(Math.random()*14);
  wind={x:Math.sin(wa)*ws,y:Math.cos(wa)*ws,mph:ws};
  // Honours: on later holes the best score on the previous hole tees off first
  order=players.map((_,k)=>k);
  if(i>0&&mode==='pnp')order.sort((a,b)=>(players[a].scores[i-1]||99)-(players[b].scores[i-1]||99)||a-b);
  for(const p of players){p.ball={x:0,y:1};p.strokes=0;p.holed=false;p.pvUsed=false}
  state='ready'; clearUndo(); gameOn=true;
  $('#end').hidden=true; $('#toast').hidden=true;
  useTurn(order[0]);
  $('#hname').textContent=`Hole ${i+1} · ${H.name}`;
  $('#par').textContent=H.par; $('#len').textContent=H.len;
  $('#windMph').textContent=ws;
  $('#windArrow').style.transform=`rotate(${Math.atan2(wind.x,wind.y)/RAD}deg)`;
  $('#log').textContent=i===0?'Drag anywhere on the course to nudge your aim, or tap to jump it.':`Hole ${i+1}, par ${H.par}.`;
  hud(); if(W)updateCam(0,true);
  if(players.length>1)showPass(true);
}
// Start a game. cfg: {mode, names?, hole?}
let lastCfg={mode:'solo'};
function startGame(cfg){
  lastCfg=cfg; mode=cfg.mode; mulls=(mode==='solo'||mode==='rival')?1:0;
  const names=cfg.mode==='pnp'?cfg.names:['You'];
  $('#world').hidden=true; worldOn=false;
  if(cfg.mode==='rival')rival=makeRival(cfg.rival);
  players=names.map((n,k)=>({name:n,col:PCOLS[k],ball:{x:0,y:1},strokes:0,holed:false,scores:[]}));
  pi=0; scores=players[0].scores;
  $('#menu').hidden=true;
  loadHole(cfg.mode==='practice'?cfg.hole:cfg.mode==='rival'?rival.s:0);
}
const newRound=()=>startGame(lastCfg);
function storeTurn(){const p=players[pi];p.ball={...ball};p.strokes=strokes}
function useTurn(k){
  pi=k;const p=players[k];ball={...p.ball};strokes=p.strokes;scores=p.scores;
  trace=[];frozen=null;setSpin(0,0);ci=autoClub();aim=defaultAim();hud();
  if(W)updateCam(0,true);
}
// After every shot in pass and play: tee shots go in honour order, then furthest from the hole plays
function nextTurn(){
  storeTurn();
  const live=players.map((_,k)=>k).filter(k=>!players[k].holed);
  if(!live.length){endHole();return}
  const tee=order.filter(k=>!players[k].holed&&players[k].strokes===0);
  const n=tee.length?tee[0]:live.reduce((a,b)=>dist(players[b].ball,PIN)>dist(players[a].ball,PIN)?b:a);
  state='ready'; useTurn(n); showPass(false);
}
function standingsHTML(){
  return players.map(p=>{const pl=p.scores.reduce((a,s,k)=>a+(s?HOLES[k].par:0),0),st=p.scores.reduce((a,s)=>a+(s||0),0);
    return `<span class="chip who"><i style="background:${p.col}"></i>${esc(p.name)} ${toPar(st-pl)}</span>`}).join('');
}
function showPass(newHole){
  const p=players[pi],s=surfaceAt(ball.x,ball.y);
  $('#passHole').textContent=`Hole ${holeIdx+1} · ${H.name} · Par ${H.par}`;
  $('#passBall').style.background=p.col;
  $('#passName').textContent=p.name;
  $('#passInfo').textContent=p.strokes===0?(newHole&&pi===order[0]&&holeIdx>0?'Has the honour. Tee off.':'Tee off'):`Shot ${p.strokes+1} · ${fmtDist(dist(ball,PIN),s==='green')} to pin · ${SURF[s].name}`;
  $('#passStand').innerHTML=standingsHTML();
  $('#passLast').innerHTML=newHole||$('#toast').hidden?'':$('#toast').innerHTML;
  $('#toast').hidden=true;
  $('#pass').hidden=false;
}
$('#passGo').onclick=()=>{$('#pass').hidden=true};
const club=()=>CLUBS[ci];
function autoClub(){
  const s=surfaceAt(ball.x,ball.y); if(s==='green')return PUTTER;
  const d=dist(ball,PIN);
  for(let i=PUTTER-1;i>=0;i--) if(carryOf(i)>=d*.97) return i;
  return 0;
}
function defaultAim(){
  const c=club(), d=dist(ball,PIN);
  const cc=carryOf(ci);
  if(c.putter||d<=cc*1.04)return{...PIN};
  let best=null,be=1e9;
  for(const p of H.cl){if(p.y<=ball.y+5)continue;const e=Math.abs(dist(p,ball)-cc);if(e<be){be=e;best=p}}
  return best?{x:best.x,y:best.y}:{...PIN};
}
function fmtDist(yd,putt){return putt||yd<20?`${Math.round(yd*3)} ft`:`${Math.round(yd)} yds`}
function hud(){
  const c=club(), s=surfaceAt(ball.x,ball.y);
  $('#stroke').textContent=Math.min(strokes+1,99);
  $('#total').textContent=mode==='practice'?'Practice':mode==='rival'?rivalLine():toPar(playedStrokes()-playedPar());
  const ed=eqDef(),lv=lvlOf(ed.id);
  const P=players[pi],multi=players.length>1;
  $('#who').hidden=!multi;
  if(multi)$('#who').innerHTML=`<i style="background:${P.col}"></i>${esc(P.name)}`;
  $('#bagBtn').hidden=mode==='pnp'; $('#cardBtn').hidden=mode==='practice';
  $('#clubName').textContent=ed.n;
  $('#clubName').style.color=ed.r==='common'?'':RAR[ed.r].col;
  $('#clubCarry').textContent=c.putter?`Lv ${lv}`:`${carryOf(ci)} yds · Lv ${lv}`;
  $('#lie').textContent=SURF[s].name;
  const onG=s==='green'||s==='fringe'; $('#slope').hidden=!onG;
  if(onG)$('#slope').textContent=`${slopeWord(ball.x,ball.y)} slope`;
  $('#topin').textContent=`${fmtDist(dist(ball,PIN),c.putter)} to pin`;
  $('#preview').hidden=!c.putter; previewBtn(); undoBtn();
  $('#spin').hidden=c.putter; $('.stage').classList.toggle('has-spin',!c.putter);
  $('#padHint').textContent=c.putter?'Pull down and let go':'Swipe down · pause · swipe up';
}
function toast(html){const t=$('#toast');t.innerHTML=html;t.hidden=false}

/* ---------- Shots ---------- */
const dirOf=a=>({x:Math.sin(a),y:Math.cos(a)});
const angTo=(a,b)=>Math.atan2(b.x-a.x,b.y-a.y);

function strike(r){
  const c=club(), lie=surfaceAt(ball.x,ball.y), L=SURF[lie], S=eqStats(), perk=eqPerk(), sf=spinF();
  let pow=lie==='sand'?(perk==='sand'?1:c.sand?.92:L.pow):L.pow;
  pow+=(1-pow)*S.F*.035;                       // forgiveness claws back lie penalties
  const notes=[], fg=1-S.F*.03;                // forgiveness softens tempo/overswing scatter
  let p=r.p, mult=p<=1?p:1+(p-1)*.4, noise=.8*L.vari*(1-S.F*.02);
  if(p>1){noise+=(p-1)*25*fg;notes.push('overswing')}
  if(r.pause<70){noise+=2.5*fg;notes.push('rushed transition')}
  else if(r.pause>700){mult*=.93;notes.push('hung at the top')}
  if(r.follow<.6){mult*=.85;notes.push('short follow-through')}
  if(r.speed<.45){mult*=.9;notes.push('decelerated')}
  noise*=1.25-S.C*.03; const ps=1.15-S.C*.02; // control: tighter scatter, less punished by an off-line swipe
  const startDeg=r.path*.25*ps+gauss()*noise*.4;
  const curveDeg=r.path*.2*ps+gauss()*noise*.6+SP.x*5*sf;
  mult*=1-.04*Math.abs(SP.y);
  const carry=c.c*(1+S.P*.008)*mult*pow, wm=(1-.35*SP.y)*(perk==='wind'?.7:1);
  // XP: a clean, well-tempoed swing earns the most
  const clean=p<=1.02&&r.pause>=70&&r.pause<=700&&Math.abs(r.path)<4&&r.follow>=.6&&r.speed>=.45;
  const okay=p<=1.06&&r.pause>=50&&Math.abs(r.path)<8;
  const xpAmt=clean?20:okay?10:5;
  if(spinLabel()!=='Centre')notes.unshift(spinLabel().toLowerCase());
  const a=angTo(ball,aim);
  const d0=dirOf(a+startDeg*RAD), d1=dirOf(a+(startDeg+curveDeg)*RAD);
  const P0={x:ball.x+d0.x*carry,y:ball.y+d0.y*carry};
  const Land={x:ball.x+d1.x*carry+wind.x*carry*.0045*wm,y:ball.y+d1.y*carry+wind.y*carry*.0045*wm};
  const tot=startDeg+curveDeg;
  const shape=Math.abs(tot)<1.2?'Straight':tot>0?(tot<4?'Fade':'Slice'):(tot>-4?'Draw':'Hook');
  saveUndo();
  shotStart={...ball}; shotClub=c; strokes++;
  flight={from:{...ball},P0,L:Land,t:0,dur:.8+carry/140,apex:c.apex*Math.min(1,mult)*(1-.35*SP.y),carry,shape,rm:rollMult(),perk,bs:c.bs*sf,xpMsg:gainXp(xpAmt)};
  frozen=[{...ball},{...aim},Land];
  trace=[{...ball}]; state='flight'; $('#toast').hidden=true;
  $('#log').innerHTML=`Power <b>${Math.round(p*100)}%</b> · Path <b>${Math.abs(r.path).toFixed(1)}° ${r.path>=0?'R':'L'}</b> · Pause <b>${Math.round(r.pause)}ms</b> · Speed <b>${r.speed.toFixed(2)}</b>`;
  flight.notes=notes;
  setSpin(0,0);
}
function flightPos(t){const f=flight;return{x:f.from.x+(f.P0.x-f.from.x)*t+(f.L.x-f.P0.x)*t*t,y:f.from.y+(f.P0.y-f.from.y)*t+(f.L.y-f.P0.y)*t*t}}
function land(){
  const f=flight, L=f.L, s=surfaceAt(L.x,L.y);
  trace.push({...L});
  const head=`<b>${shotClub.n}</b> · ${Math.round(f.carry)} carry · ${f.shape}${f.notes.length?' · '+f.notes.join(', '):''}`;
  if(s==='ob'){penalty(head);return}
  if(s==='water'){ball={...L};dropFromWater(f.from,head);return}
  ball={...L}; lastDry={...L};
  if(s==='trees'){flight.head=head;stopBall(head+'<br>Clipped the trees and dropped.');return}
  const prev=flightPos(.92), dx=L.x-prev.x, dy=L.y-prev.y, m=Math.hypot(dx,dy)||1;
  let d=f.carry*shotClub.roll*SURF[s].land*Math.max(0,f.rm)*(f.perk==='roll'?1.25:1), sgn=1, hd=head;
  if(f.rm<0&&(s==='green'||s==='fringe')){d=f.carry*.06*-f.rm*f.bs*(f.perk==='spinback'?1.5:1);sgn=-1;hd+=' · <b>spun back</b>'}
  const v=Math.sqrt(2*SURF[s].fric*d)*sgn;
  vel={x:dx/m*v,y:dy/m*v}; flight.head=hd; state='roll';
}
function startPutt(r){
  const lie=surfaceAt(ball.x,ball.y);
  const a=angTo(ball,aim)+r.tilt*tiltK()*RAD;
  const v=Math.sqrt(2*SURF.green.fric*r.yd);
  saveUndo();
  if(previewAvail()&&mode!=='practice')players[pi].pvUsed=true;
  shotStart={...ball}; shotClub=club(); strokes++; lastDry={...ball};
  vel={x:Math.sin(a)*v,y:Math.cos(a)*v}; trace=[]; frozen=null;
  flight={head:`<b>Putt</b> · hit for ${Math.round(r.yd*3)} ft`,cap:capR(),putt:true}; state='roll'; lipped=false; $('#toast').hidden=true;
  $('#log').innerHTML=`Pull <b>${Math.round(r.yd*3)} ft</b> · Tilt <b>${Math.abs(r.tilt).toFixed(1)}° ${r.tilt>=0?'R':'L'}</b>${lie!=='green'?' · from the '+SURF[lie].name.toLowerCase():''}`;
}
function stepRoll(dt){
  const s=surfaceAt(ball.x,ball.y);
  if(s==='water'){dropFromWater(shotStart,flight.head);return}
  if(s==='ob'){penalty(flight.head);return}
  lastDry={...ball};
  if(s==='green'||s==='fringe'){const sl=slope(ball.x,ball.y);vel.x+=sl.x*dt;vel.y+=sl.y*dt}
  const sp=Math.hypot(vel.x,vel.y), ns=sp-SURF[s].fric*dt;
  if(ns<=.03){vel={x:0,y:0};stopBall(flight.head);return}
  vel.x*=ns/sp; vel.y*=ns/sp;
  ball.x+=vel.x*dt; ball.y+=vel.y*dt;
  const dp=dist(ball,PIN), cap=flight.cap||.09;
  if((dp<cap&&ns<2)||(dp<cap*.5&&ns<3.2)){holeOut();return}
  if(dp<cap&&!lipped){lipped=true;const a=(Math.random()-.5)*50*RAD,c=Math.cos(a),sn=Math.sin(a);vel={x:(vel.x*c-vel.y*sn)*.7,y:(vel.x*sn+vel.y*c)*.7}}
  if(dp>.2)lipped=false;
}
function readyAgain(){
  state='ready';$('#undo').disabled=!undoStack.length;ci=autoClub();aim=defaultAim();hud();frozen=null;
  if(players.length>1){
    // Pick-up rule keeps pass and play moving: par + 5 is the most anyone can score on a hole
    if(strokes>=H.par+5){players[pi].holed=true;scores[holeIdx]=H.par+5;const nm=esc(players[pi].name);setTimeout(()=>toast(`${$('#toast').innerHTML}<br><b>${nm}</b> picks up · scores ${H.par+5}`),0)}
    state='wait';setTimeout(nextTurn,1500);
  }
}
// Putter control narrows how much a tilted pull pushes the putt off line; forgiveness and perks widen the cup
const tiltK=()=>.12*(1.3-eqStats().C*.03);
const capR=()=>{const pid=bagOf('putter');return .09*(1+statsOf(pid).F*.02)*(DEF[pid].perk==='capture'?1.4:1)};
const xpLine=()=>flight&&flight.xpMsg?`<br><span class="reward">${flight.xpMsg}</span>`:'';
function stopBall(head){
  const moved=dist(shotStart,ball);
  if(flight.putt){const left=dist(ball,PIN);flight.xpMsg=gainXp(left<1?10:4)}
  const xl=xpLine(); readyAgain();
  toast(`${head}<br>${fmtDist(moved,shotClub.putter)} · ${SURF[surfaceAt(ball.x,ball.y)].name}${xl}`);
}
function dropFromWater(from,head){
  // step back toward where the shot came from until dry, then 2 more yards
  const a=angTo(ball,from); let p={...ball};
  for(let i=0;i<200&&surfaceAt(p.x,p.y)==='water';i++){p.x+=Math.sin(a);p.y+=Math.cos(a)}
  p.x+=Math.sin(a)*2;p.y+=Math.cos(a)*2;
  ball=p; strokes++; const xl=xpLine(); readyAgain();
  toast(`${head}<br><b>Splash.</b> Penalty drop, +1 stroke.${xl}`);
}
function penalty(head){
  ball={...shotStart}; strokes++; const xl=xpLine(); readyAgain();
  toast(`${head}<br><b>Out of bounds.</b> +1 stroke, replay from where you hit.${xl}`);
}

/* ---------- Scoring ---------- */
const NAMES={'-3':'Albatross','-2':'Eagle','-1':'Birdie','0':'Par','1':'Bogey','2':'Double Bogey','3':'Triple Bogey'};
function scoreCell(s,par){if(!s)return '';const d=s-par,c=d<=-2?'uu':d===-1?'u':d===1?'o':d>=2?'oo':'';return `<span class="sc ${c}">${s}</span>`}
function cardHTML(){
  const head=HOLES.map((_,i)=>`<td>${i+1}</td>`).join(''),pars=HOLES.map(h=>`<td>${h.par}</td>`).join('');
  const multi=players.length>1;
  const rows=players.map((p,k)=>{
    const sc=HOLES.map((h,i)=>`<td class="${k===pi&&i===holeIdx&&!p.scores[i]?'cur':''}">${scoreCell(p.scores[i],h.par)}</td>`).join('');
    const tot=p.scores.reduce((a,s)=>a+(s||0),0);
    return `<tr class="now"><th class="pn">${multi?`<span class="who"><i style="background:${p.col}"></i>${esc(p.name)}</span>`:'Score'}</th>${sc}<td class="tot">${tot||'–'}</td></tr>`}).join('');
  let rrow='';
  if(mode==='rival'&&rival){const shown=k=>k>=rival.s&&k<rival.s+rival.holes&&scores[k]!=null;
    rrow=`<tr class="now"><th class="pn"><span class="who"><i style="background:${rival.col}"></i>${esc(rival.name.split(' ')[0])}</span></th>${HOLES.map((h,k)=>`<td>${shown(k)?scoreCell(rival.scores[k],h.par):''}</td>`).join('')}<td class="tot">${rival.scores.filter((_,k)=>shown(k)).reduce((a,b)=>a+b,0)||'–'}</td></tr>`}
  return `<div class="card-wrap"><table class="card"><tr><th>Hole</th>${head}<td class="tot">Tot</td></tr><tr><th>Par</th>${pars}<td class="tot">${COURSE_PAR}</td></tr>${rows}${rrow}</table></div>`;
}
function showEnd(html){const e=$('#end');e.innerHTML=html;e.hidden=false}
function holeOut(){
  ball={...PIN}; vel={x:0,y:0}; scores[holeIdx]=strokes; players[pi].holed=true;
  if(flight&&flight.putt)gainXp(20);
  const diff=strokes-H.par;
  if(players.length>1){
    state='wait'; hud();
    toast(`<b>${esc(players[pi].name)}</b> holes out · ${strokes===1?'Hole in one!':(NAMES[diff]||`+${diff}`)} (${strokes})`);
    setTimeout(nextTurn,1700); return;
  }
  state='done'; storeTurn(); endHole();
}
function endHole(){
  state='done'; clearUndo(); hud();
  if(mode==='pnp')return setTimeout(endHolePnp,500);
  if(mode==='practice')return setTimeout(endHolePractice,700);
  if(mode==='rival')return setTimeout(endHoleRival,700);
  const diff=strokes-H.par, last=holeIdx===HOLES.length-1;
  // Rewards: coins per hole; a tuning kit only for finishing the round under par
  let coins=strokes===1?300:diff<=-2?150:diff===-1?60:diff===0?25:diff===1?10:0, kits=0;
  if(last){coins+=100;if(playedStrokes()<COURSE_PAR)kits=1}
  save.coins+=coins; save.kits+=kits; persist();
  const rw=`<div class="reward">+${coins} coins${kits?` · +${kits} tuning kit${kits>1?'s':''}`:''}${last?' (includes 100 round bonus)':''}</div>`;
  setTimeout(()=>{
    const label=strokes===1?'Hole in one!':(NAMES[diff]||`+${diff}`);
    if(!last){
      showEnd(`<div class="k">Hole ${holeIdx+1} · ${H.name}</div><div class="big">${label}</div><div class="sub">${strokes} stroke${strokes>1?'s':''} · Round ${toPar(playedStrokes()-playedPar())}</div>${rw}${cardHTML()}<div class="btns"><button id="nextHole" class="btn">Hole ${holeIdx+2}</button><button id="endBag" class="btn alt">Bag</button></div>`);
      $('#nextHole').onclick=()=>loadHole(holeIdx+1);
      $('#endBag').onclick=()=>openSheet('bag');
    }else{
      const tot=playedStrokes(),rel=tot-COURSE_PAR,isBest=!best||tot<best;
      if(isBest){best=tot;try{localStorage.setItem('fsl-best-round',best)}catch(e){}}
      showEnd(`<div class="k">Round complete · ${label} on the last</div><div class="big">${tot} (${toPar(rel)})</div><div class="sub">${isBest?'New best round!':`Best round: ${best}`}</div>${rw}${cardHTML()}<div class="btns"><button id="again" class="btn">Play again</button><button id="endBag" class="btn alt">Pro shop</button></div>`);
      $('#endBag').onclick=()=>openSheet('shop');
      $('#again').onclick=newRound;
      gameOn=false;
    }
  },700);
}
/* ---------- Rival matches (story mode) ---------- */
let rival=null;
// s = first hole, odds = chance of each score against par, quips = what they say when they win, halve or lose a hole
const RIVALS={
  toby:{name:'Toby Crane',col:'#e05a4f',s:0,holes:3,odds:[[-1,.15],[0,.5],[1,.3],[2,.05]],
    quips:{won:['Too easy.','Read it and weep.'],half:['Fine. Next.'],lost:['The wind gusted.','Whatever.']}},
  dot:{name:'Dot Ainsworth',col:'#2a7f8f',s:3,holes:3,odds:[[-1,.12],[0,.66],[1,.2],[2,.02]],
    quips:{won:['Lovely.','Steady wins it, dear.'],half:['Honours even.'],lost:['Oh, well struck!','Good for you, dear.']}},
  marcus:{name:'Marcus Vane',col:'#ff6a1a',s:6,holes:3,odds:[[-2,.07],[-1,.28],[0,.22],[1,.25],[2,.18]],
    quips:{won:['Boom. Did you see that?','The sponsors will love that.'],half:['Should have been a birdie.'],lost:['These greens are a disgrace.','My glove slipped.']}},
  duncan:{name:'Duncan Moray',col:'#7a2430',s:0,holes:9,title:'Club Championship',odds:[[-1,.22],[0,.56],[1,.19],[2,.03]],
    quips:{won:['Aye.','That\'s how it\'s done.'],half:['Hm.'],lost:['Good shot.','You\'ve been practising.']}}
};
function makeRival(id){
  const R=RIVALS[id];
  // the rival's score on each hole is rolled before you tee off, and revealed once you hole out
  const scores=[];for(let k=R.s;k<R.s+R.holes;k++){let r=Math.random(),d=0;for(const [v,p] of R.odds){if(r<p){d=v;break}r-=p}scores[k]=HOLES[k].par+d}
  return{id,...R,scores};
}
function rivalTotals(upTo){let me=0,him=0;for(let k=rival.s;k<=upTo;k++){me+=scores[k]||0;him+=rival.scores[k]}return{me,him}}
function rivalLine(){
  if(!rival)return '';
  let lastDone=-1;for(let k=rival.s;k<rival.s+rival.holes;k++)if(scores[k]!=null)lastDone=k;
  if(lastDone<0)return `vs ${rival.name.split(' ')[0]}`;
  const t=rivalTotals(lastDone),d=t.him-t.me;
  return d===0?'All square':d>0?`${d} up`:`${-d} down`;
}
function endHoleRival(){
  const h=holeIdx,mine=scores[h],his=rival.scores[h],t=rivalTotals(h),d=t.him-t.me,last=h===rival.s+rival.holes-1;
  const first=rival.name.split(' ')[0],label=rival.title||`${rival.name} match`;
  const lead=d===0?'All square':d>0?`You lead by ${d}`:`${first} leads by ${-d}`;
  const qs=rival.quips[his<mine?'won':his===mine?'half':'lost'],quip=`<div class="blurb">“${esc(qs[Math.floor(Math.random()*qs.length)])}” · ${esc(first)}</div>`;
  if(!last){

/* ---------- Swing pad ---------- */
let sw=null, PW=0, PH=0;
const padPt=e=>{const r=pad.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,t:performance.now()}};
const maxBack=()=>PH*.62;
const cancelGap=s=>Math.max(60,PW*(s.phase==='through'?.4:.26));
pad.addEventListener('pointerdown',e=>{
  if(state!=='ready'||!$('#end').hidden)return; pad.setPointerCapture(e.pointerId);
  const p=padPt(e); sw={phase:'back',s:p,low:p,pts:[p],putt:club().putter};
  $('#padHint').hidden=true; drawPad();
});
pad.addEventListener('pointermove',e=>{
  if(!sw)return; const p=padPt(e); sw.pts.push(p);
  // slide sideways past the red lines to cancel (a bit further once the upswing has started)
  sw.cancel=Math.abs(p.x-sw.s.x)>cancelGap(sw);
  pad.classList.toggle('cancel',sw.cancel);
  if(sw.cancel){$('#padRead').textContent='Release to cancel';$('#padRead').style.color='var(--hazard)';drawPad();return}
  if(sw.phase==='back'){
    if(p.y>sw.low.y+.5)sw.low=p;
    else if(!sw.putt&&sw.low.y-p.y>14&&sw.low.y-sw.s.y>10){sw.phase='through';sw.pause=p.t-sw.low.t;sw.tStart=p.t}
  }

});
function endSwing(e){
  if(!sw)return; const p=padPt(e), s=sw; sw.done=true; drawPad(); sw=null;
  $('#padRead').textContent=''; pad.classList.remove('cancel');
  if(s.cancel){lastSw=null;drawPad();$('#padHint').hidden=false;$('#log').textContent='Shot cancelled. No stroke taken.';return}
  const back=s.low.y-s.s.y;
  if(s.putt){
    if(back<6){$('#padHint').hidden=false;return}
    const k=Math.min(1,back/(PH*.7));
    startPutt({yd:Math.pow(k,1.3)*30,tilt:Math.atan2(s.low.x-s.s.x,back)/RAD});
    return;
  }
  if(s.phase!=='through'||back<maxBack()*.08){$('#padHint').hidden=false;$('#log').textContent='No swing. Swipe down, pause, then swipe up through the pad.';return}
  const up=s.low.y-p.y, dx=p.x-s.low.x;
  strike({p:Math.min(1.15,back/maxBack()),path:Math.atan2(dx,Math.max(1,up))/RAD,pause:s.pause,speed:up/Math.max(1,p.t-s.tStart),follow:up/back});
}
pad.addEventListener('pointerup',endSwing);
pad.addEventListener('pointercancel',()=>{sw=null;pad.classList.remove('cancel');$('#padRead').textContent='';$('#padHint').hidden=false;drawPad()});
function readout(){
  const r=$('#padRead'); if(!sw){r.textContent='';return}
  const back=Math.max(0,sw.low.y-sw.s.y);
  if(sw.putt){const k=Math.min(1,back/(PH*.7));r.textContent=`${Math.round(Math.pow(k,1.3)*90)} ft`;r.style.color='var(--chalk)';return}
  const p=back/maxBack(); r.textContent=`${Math.round(Math.min(1.15,p)*100)}%`;
  r.style.color=p>1?'var(--hazard)':'var(--chalk)';
}
let lastSw=null;
function drawPad(){
  const s=sw||lastSw; if(sw)lastSw=sw;
  pctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); pctx.clearRect(0,0,PW,PH);
  // meter on the right edge
  const mx=PW-18, top=10, bot=PH-10;
  pctx.fillStyle='rgba(255,255,255,.08)'; pctx.fillRect(mx,top,8,bot-top);
  if(s&&!s.putt){
    const p=Math.min(1.15,Math.max(0,(s.low.y-s.s.y)/maxBack())), h=(bot-top)*p/1.15;
    pctx.fillStyle=p>1?'#ec7a55':'#8fd88a'; pctx.fillRect(mx,bot-h,8,h);
  }
  const t100=bot-(bot-top)/1.15; pctx.fillStyle='#f2c14e'; pctx.fillRect(mx-4,t100-1,16,2);
  if(sw){
    // cancel zones either side of where your thumb started
    const g=cancelGap(sw), L=sw.s.x-g, R=sw.s.x+g;
    pctx.fillStyle=sw.cancel?'rgba(236,122,85,.32)':'rgba(236,122,85,.14)';
    if(L>0)pctx.fillRect(0,0,L,PH);
    if(R<PW)pctx.fillRect(R,0,PW-R,PH);
    pctx.strokeStyle='rgba(236,122,85,.8)';pctx.lineWidth=2;pctx.setLineDash([6,6]);
    pctx.beginPath();if(L>0){pctx.moveTo(L,0);pctx.lineTo(L,PH)}if(R<PW){pctx.moveTo(R,0);pctx.lineTo(R,PH)}pctx.stroke();pctx.setLineDash([]);
    if(!sw.cancel){pctx.font='800 11px "Nunito Sans",system-ui,sans-serif';pctx.fillStyle='rgba(236,122,85,.95)';pctx.textAlign='center';pctx.fillText('Slide into red to cancel',sw.s.x,PH-10);pctx.textAlign='left'}
  }
  if(!s)return;
  pctx.lineWidth=5; pctx.lineCap='round'; pctx.lineJoin='round';
  const i=s.pts.findIndex(q=>q.t>=(s.tStart??Infinity));
  const backPts=i<0?s.pts:s.pts.slice(0,i+1), thruPts=i<0?[]:s.pts.slice(i);

}

// Runs the same roll physics as a real putt, without moving the ball
function simPutt(yd,tilt){
  const a=angTo(ball,aim)+tilt*tiltK()*RAD, v=Math.sqrt(2*SURF.green.fric*yd), cap=capR();
  let p={...ball},vx=Math.sin(a)*v,vy=Math.cos(a)*v; const pts=[{...p}], dt=1/120;
  for(let i=0;i<3000;i++){
    const s=surfaceAt(p.x,p.y); if(s==='water'||s==='ob')break;
    if(s==='green'||s==='fringe'){const sl=slope(p.x,p.y);vx+=sl.x*dt;vy+=sl.y*dt}
    const sp=Math.hypot(vx,vy),ns=sp-SURF[s].fric*dt; if(ns<=.03)break;
    vx*=ns/sp;vy*=ns/sp;p.x+=vx*dt;p.y+=vy*dt; if(i%5===0)pts.push({...p});
    const dp=dist(p,PIN); if((dp<cap&&ns<2)||(dp<cap*.5&&ns<3.2)){pts.push({...PIN});return{pts,holed:true,end:{...PIN}}}
  }
  pts.push({...p}); return{pts,holed:false,end:{...p}};
}

// What the shot does with a perfectly straight swipe at the aim distance
function predictShot(c){

  const P0={x:ball.x+D0.x*d,y:ball.y+D0.y*d},P={x:ball.x+D1.x*d,y:ball.y+D1.y*d};
  const at=t=>({x:ball.x+(P0.x-ball.x)*t+(P.x-P0.x)*t*t,y:ball.y+(P0.y-ball.y)*t+(P.y-P0.y)*t*t});
  const s=surfaceAt(P.x,P.y),S=SURF[s],rm=rollMult();let roll=0,back=false;
  if(S.land!==undefined){if(rm<0&&(s==='green'||s==='fringe')){roll=d*.06*-rm*c.bs*sf*(perk==='spinback'?1.5:1);back=true}else roll=d*c.roll*S.land*Math.max(0,rm)*(perk==='roll'?1.25:1)}

/* ---------- Camera ---------- */
let W=0,H2=0;
function resize(){
  const d=devicePixelRatio||1, r=cv.getBoundingClientRect(); W=r.width;H2=r.height;
  cv.width=Math.round(W*d);cv.height=Math.round(H2*d);
  const pr=pad.getBoundingClientRect(); PW=pr.width;PH=pr.height;
  pcv.width=Math.round(PW*d);pcv.height=Math.round(PH*d); drawPad();
}
addEventListener('resize',resize);
function camTarget(){
  let pts,padY,minW,minH;
  if(club().putter&&state!=='flight'){pts=[ball,PIN,aim];padY=3;minW=10;minH=12}
  else{pts=frozen?[...frozen,ball]:[ball,aim];if(!frozen&&dist(ball,PIN)<club().c*1.3)pts.push(PIN);padY=22;minW=60;minH=80}
  let x0=Math.min(...pts.map(p=>p.x))-padY,x1=Math.max(...pts.map(p=>p.x))+padY,y0=Math.min(...pts.map(p=>p.y))-padY,y1=Math.max(...pts.map(p=>p.y))+padY;
  const cx=(x0+x1)/2,cy=(y0+y1)/2,bw=Math.max(minW,x1-x0),bh=Math.max(minH,y1-y0);
  return{x:cx,y:cy,s:Math.min(40,W/bw,H2/bh)};
}
function updateCam(dt,snap){
  const t=camTarget(),k=snap?1:1-Math.exp(-dt*3.5);
  cam.x+=(t.x-cam.x)*k;cam.y+=(t.y-cam.y)*k;cam.s=Math.exp(Math.log(cam.s)+(Math.log(t.s)-Math.log(cam.s))*k);
}

/* ---------- Drawing ---------- */
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function slopeCol(k,a){
  // gentle = chalk white, medium = gold, steep = red-orange
  const A=[238,243,228],B=[242,193,78],C=[236,92,58];
  const [p,q,t]=k<.5?[A,B,k/.5]:[B,C,(k-.5)/.5];
  return `rgba(${p.map((v,i)=>Math.round(v+(q[i]-v)*t)).join(',')},${a.toFixed(3)})`;
}
function slopeWord(x,y){const sl=slope(x,y),k=Math.min(1,Math.hypot(sl.x,sl.y));return k<.4?'Gentle':k<.7?'Medium':'Steep'}

let previewEnd=null;
function draw(){
  const d=devicePixelRatio||1,s=cam.s,px=1/s,G=H.green;
  ctx.setTransform(d,0,0,d,0,0); ctx.fillStyle='#1d3b26'; ctx.fillRect(0,0,W,H2);
  ctx.setTransform(d*s,0,0,-d*s,d*(W/2-cam.x*s),d*(H2/2+cam.y*s));
  const B=H.bounds;
  for(let y=B.y0,i=0;y<B.y1;y+=10,i++){ctx.fillStyle=i%2?'#447f3c':'#4a8641';ctx.fillRect(B.x0,y,B.x1-B.x0,Math.min(10,B.y1-y))}
  // OB stakes
  ctx.fillStyle='#f4f4f0';
  for(let y=B.y0;y<=B.y1;y+=20){ctx.beginPath();ctx.arc(B.x0,y,2.2*px,0,7);ctx.arc(B.x1,y,2.2*px,0,7);ctx.fill()}
  for(let x=B.x0;x<=B.x1;x+=20){ctx.beginPath();ctx.arc(x,B.y1,2.2*px,0,7);ctx.fill()}
  // fairway
  ctx.lineCap='round';ctx.lineJoin='round';
  const fw=()=>{ctx.beginPath();H.fw.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]))};
  fw();ctx.strokeStyle='#56933f';ctx.lineWidth=H.hw*2+3;ctx.stroke();
  fw();ctx.strokeStyle='#69a957';ctx.lineWidth=H.hw*2;ctx.stroke();
  // tee
  ctx.fillStyle='#74ba60';ctx.fillRect(TEE.x0,TEE.y0,TEE.x1-TEE.x0,TEE.y1-TEE.y0);
  ctx.fillStyle='#f4f4f0';ctx.beginPath();ctx.arc(-4,2,.7,0,7);ctx.arc(4,2,.7,0,7);ctx.fill();
  // yardage stakes
  for(const k of H.stakes){ctx.fillStyle=k.col;ctx.beginPath();ctx.arc(k.x,k.y,Math.max(1,3*px),0,7);ctx.fill()}
  // water
  for(const w of H.water){ell(w,1.06);ctx.fillStyle='#3a6e44';ctx.fill()}
  for(const w of H.water){ell(w);ctx.fillStyle='#2b77a3';ctx.fill();ell({x:w.x-w.rx*.2,y:w.y+w.ry*.15,rx:w.rx*.55,ry:w.ry*.6});ctx.fillStyle='#3b8ebd';ctx.fill()}
  // green
  ell(G,1.28);ctx.fillStyle='#5fae4f';ctx.fill();
  ctx.save();ell(G);ctx.fillStyle='#7ccb66';ctx.fill();ctx.clip();
  ctx.fillStyle='#86d36f';for(let x=G.x-30;x<G.x+30;x+=4){ctx.beginPath();ctx.moveTo(x,G.y-15);ctx.lineTo(x+2,G.y-15);ctx.lineTo(x+12,G.y+15);ctx.lineTo(x+10,G.y+15);ctx.fill()}
  ctx.restore();
  // bunkers
  for(const b of H.bunkers){ell(b,1.12);ctx.fillStyle='#4f8a3f';ctx.fill();ell(b);ctx.fillStyle='#ead9a8';ctx.fill();ctx.lineWidth=1.5*px;ctx.strokeStyle='#c9b07a';ctx.stroke()}
  // slope chevrons when zoomed in: flow downhill, faster, bigger and hotter in colour where it's steeper
  if(s>5){
    const step=s>15?1.6:2.6, T=performance.now()/1000;
    ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=2.6*px;
    for(let x=G.x-G.rx;x<=G.x+G.rx;x+=step)for(let y=G.y-G.ry;y<=G.y+G.ry;y+=step){
      if(!inEll(x,y,G,.97))continue;
      const sl=slope(x,y),m=Math.hypot(sl.x,sl.y),ux=sl.x/m,uy=sl.y/m,k=Math.min(1,m);
      const seed=((x*.37+y*.61)%1+1)%1;
      const ph=RM?.5:((T*(.2+k*1.2)+seed)%1);
      const off=(ph-.5)*step*.85, cx=x+ux*off, cy=y+uy*off;
      const L=step*(.16+.24*k), w=L*.85;
      ctx.strokeStyle=slopeCol(k,Math.sin(ph*Math.PI)*(.6+.4*k));
      const chev=(tx,ty)=>{ctx.beginPath();ctx.moveTo(tx-ux*L-uy*w,ty-uy*L+ux*w);ctx.lineTo(tx,ty);ctx.lineTo(tx-ux*L+uy*w,ty-uy*L-ux*w);ctx.stroke()};
      chev(cx,cy);
      if(k>.6)chev(cx-ux*L*.75,cy-uy*L*.75);
    }
  }
  // trees
  for(const t of H.treesList){ctx.fillStyle='rgba(10,30,15,.35)';ctx.beginPath();ctx.arc(t.x+1.2,t.y-1.5,t.r,0,7);ctx.fill()}
  for(const t of H.treesList){ctx.fillStyle='#2a5d33';ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,7);ctx.fill();ctx.fillStyle='#377242';ctx.beginPath();ctx.arc(t.x-t.r*.3,t.y+t.r*.3,t.r*.5,0,7);ctx.fill()}
  // cup
  ctx.fillStyle='#10150f';ctx.beginPath();ctx.arc(PIN.x,PIN.y,Math.max(.065,3.5*px),0,7);ctx.fill();
  // aim
  const c=club();
  if(state==='ready'){
    ctx.setLineDash([5*px,5*px]);ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=1.6*px;
    if(c.putter){ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(aim.x,aim.y);ctx.stroke();ctx.setLineDash([])}
    else{
      const pr=predictShot(c);
      ctx.beginPath();for(let i=0;i<=24;i++){const q=pr.at(i/24);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)}ctx.stroke();ctx.setLineDash([]);
      if(pr.roll>.4){

      }
      const r=Math.max(2,c.c*.06*(1.25-eqStats().C*.03));ctx.strokeStyle='rgba(242,193,78,.9)';ctx.lineWidth=2*px;ctx.beginPath();ctx.arc(pr.P.x,pr.P.y,r,0,7);ctx.stroke();
    }

  }
  // putt preview: live while pulling back, otherwise a putt struck the aim distance
  previewEnd=null;

    let yd=dist(ball,aim),tilt=0;
    if(sw&&sw.putt){const back=Math.max(0,sw.low.y-sw.s.y);yd=Math.pow(Math.min(1,back/(PH*.7)),1.3)*30;tilt=Math.atan2(sw.low.x-sw.s.x,Math.max(1,back))/RAD}
    if(yd>.1){

      ctx.fillStyle=r.holed?'rgba(143,216,138,.95)':'rgba(242,193,78,.95)';
      const pts=r.pts; for(let i=0;i<pts.length;i+=2){const k=RM?1:(.55+.45*Math.sin(i*.35-T*6));ctx.globalAlpha=k;ctx.beginPath();ctx.arc(pts[i].x,pts[i].y,2.2*px,0,7);ctx.fill()}
      ctx.globalAlpha=1;ctx.strokeStyle=r.holed?'#8fd88a':'#f2c14e';ctx.lineWidth=2.4*px;ctx.beginPath();ctx.arc(r.end.x,r.end.y,7*px,0,7);ctx.stroke();

  }
  // tracer
  if(trace.length>1){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1.6*px;ctx.beginPath();trace.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}
  // ball shadow (+ height when in flight)
  let bp=ball,h=0;
  if(state==='flight'){bp=flightPos(flight.t);h=flight.apex*4*flight.t*(1-flight.t)}
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(bp.x+h*.15,bp.y-h*.25,Math.max(.04,3.5*px)*(1+h/60),Math.max(.03,2.6*px),0,0,7);ctx.fill();
  // screen-space overlays
  ctx.setTransform(d,0,0,d,0,0);
  const S=p=>({x:(p.x-cam.x)*s+W/2,y:H2/2-(p.y-cam.y)*s});
  // flag
  const fp=S(PIN);ctx.strokeStyle='#eef3e4';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(fp.x,fp.y);ctx.lineTo(fp.x,fp.y-28);ctx.stroke();
  ctx.fillStyle='#f2c14e';ctx.beginPath();ctx.moveTo(fp.x,fp.y-28);ctx.lineTo(fp.x+15,fp.y-23);ctx.lineTo(fp.x,fp.y-18);ctx.fill();
  ctx.fillStyle='#1d1a0e';ctx.font='800 9px "Nunito Sans",system-ui,sans-serif';ctx.fillText(holeIdx+1,fp.x+2,fp.y-20);
  // ball
  // other players' balls, with their initial
  if(players.length>1)players.forEach((p,k)=>{if(k===pi||p.holed)return;const q=S(p.ball);
    ctx.fillStyle=p.col;ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(q.x,q.y,4.5,0,7);ctx.fill();ctx.stroke();
    ctx.font='800 10px "Nunito Sans",system-ui,sans-serif';ctx.fillStyle='rgba(14,29,21,.85)';const t=p.name.slice(0,1).toUpperCase(),tw=ctx.measureText(t).width;
    ctx.beginPath();ctx.roundRect(q.x+6,q.y-17,tw+8,14,4);ctx.fill();ctx.fillStyle=p.col;ctx.fillText(t,q.x+10,q.y-6)});

const WTREES=[];
(()=>{ // trees around the edge and in a few clumps, seeded so the map is always the same
  sd=4242;
  const add=(n,x0,x1,y0,y1,r0,r1)=>{let tries=0;while(n>0&&tries++<600){const t={x:x0+rnd()*(x1-x0),y:y0+rnd()*(y1-y0),r:r0+rnd()*(r1-r0)};
    if(blockedAt(t.x,t.y,t.r+6,true)||WTREES.some(o=>Math.hypot(o.x-t.x,o.y-t.y)<o.r+t.r-4))continue;WTREES.push(t);n--}};
  add(14,0,640,0,70,16,24); add(10,0,40,60,880,14,22); add(10,600,640,60,880,14,22);
  add(6,190,450,60,140,14,20); add(5,560,640,560,760,14,20); add(4,0,170,620,760,14,20); add(3,170,260,430,480,12,16);
})();
function inRect(x,y,r,pad=0){return x>r.x-pad&&x<r.x+r.w+pad&&y>r.y-pad&&y<r.y+r.h+pad}
function blockedAt(x,y,rad=7,forTrees=false){
  if(x<16||y<16||x>MAP.w-16||y>MAP.h-8)return true;
  for(const b of BUILDINGS)if(inRect(x,y,b,rad))return true;
  for(const c of CARS)if(x>c.x-rad&&x<c.x+36+rad&&y>c.y-rad&&y<c.y+62+rad)return true;
  if(inEll(x,y,{x:POND.x,y:POND.y,rx:POND.rx+rad,ry:POND.ry+rad}))return true;
  for(const b of BENCHES)if(inRect(x,y,b,rad*.6))return true;
  if(forTrees){
    if(inEll(x,y,PGREEN,1.15)||inRect(x,y,TEEBOX,10))return true;
    for(const P of PATHS)if(polyDist(x,y,P)<34)return true;
    if(y>760)return true; // car park
    return false;
  }
  for(const t of WTREES)if(Math.hypot(x-t.x,y-t.y)<t.r*.55+rad)return true;
  return false;
}

function afterMatch(id,res){

    if(!save.owned[M.club])save.owned[M.club]={lvl:1,xp:0,tuned:[]};
    const extra=[];

    persist();updateGoal();updateCoins();
    return say([...M.win,NARR(`${M.clubText} added to your collection. Put it in your bag from the Bag button.`),...extra,NARR(M.next)]);
  }
  if(res==='win'){save.coins+=M.again;persist();updateCoins();return say([N(id,M.rematch)])}

  if(res==='draw')return say([N(id,M.draw)]);

const wpt=e=>{const r=wcv.getBoundingClientRect();return{x:wcam.x+(e.clientX-r.left-WW/2)/wzoom,y:wcam.y+(e.clientY-r.top-WH/2)/wzoom}};
wcv.addEventListener('pointerdown',e=>{
  if(dlg){$('#dlg').click();return}wcv.setPointerCapture(e.pointerId);const p=wpt(e);
  const hit=NPCS.find(n=>Math.hypot(n.x-p.x,n.y-14-p.y)<24);

const faceTowards=(a,b)=>{const dx=b.x-a.x,dy=b.y-a.y;return Math.abs(dx)>Math.abs(dy)?(dx>0?3:1):(dy>0?0:2)}; // 0 down,1 left,2 up,3 right
function nearNpc(){let best=null,bd=46;for(const n of NPCS){const d=Math.hypot(n.x-me.x,n.y-me.y);if(d<bd){bd=d;best=n}}return best}

// --- Update
function worldStep(dt){
  typeTick(dt);
  if(!dlg&&target){
    const dx=target.x-me.x,dy=target.y-me.y,d=Math.hypot(dx,dy);
    if(pendingTalk&&Math.hypot(pendingTalk.x-me.x,pendingTalk.y-me.y)<40){const n=pendingTalk;pendingTalk=null;target=null;me.moving=false;me.face=faceTowards(me,n);talk(n.id)}
    else if(d<3){target=holding?target:null;me.moving=false}
    else{
      const sp=110*dt,ux=dx/d,uy=dy/d,ox=me.x,oy=me.y;
      // slide along obstacles: try the full move, then each axis on its own
      const nx=me.x+ux*Math.min(sp,d),ny=me.y+uy*Math.min(sp,d);
      if(!blockedAt(nx,ny)){me.x=nx;me.y=ny}else if(!blockedAt(nx,me.y))me.x=nx;else if(!blockedAt(me.x,ny))me.y=ny;
      const moved=Math.hypot(me.x-ox,me.y-oy);me.moving=moved>.01;
      if(me.moving){me.walk+=dt*9;me.face=faceTowards({x:0,y:0},{x:ux,y:uy});stuckT=0}
      else if((stuckT+=dt)>.6&&!holding){target=null;pendingTalk=null;stuckT=0}
    }
  }else me.moving=false;
  // Pip wanders; everyone else turns to look at you when you're close
  const pip=NPC.pip;
  if(!pip.goal||Math.hypot(pip.goal.x-pip.x,pip.goal.y-pip.y)<4){if((pip.wait=(pip.wait||0)-dt)<=0){const h=pip.home;pip.goal={x:h.x0+Math.random()*(h.x1-h.x0),y:h.y0+Math.random()*(h.y1-h.y0)};pip.wait=1+Math.random()*3}}
  else if(!(dlg&&dlg.lines.some(l=>!l.who))){const dx=pip.goal.x-pip.x,dy=pip.goal.y-pip.y,d=Math.hypot(dx,dy),nx=pip.x+dx/d*60*dt,ny=pip.y+dy/d*60*dt;
    if(!blockedAt(nx,ny,5)){pip.x=nx;pip.y=ny;pip.walk=(pip.walk||0)+dt*12;pip.face=faceTowards({x:0,y:0},{x:dx,y:dy})}else pip.goal=null}
  for(const n of NPCS)if(!n.dog&&Math.hypot(n.x-me.x,n.y-me.y)<70)n.face=faceTowards(n,me);
  const nn=!dlg&&nearNpc();
  $('#wTalk').hidden=!nn;if(nn)$('#wTalk').textContent=nn.dog?'Pat Pip':`Talk to ${nn.name}`;
  // camera follows smoothly
  const k=1-Math.exp(-dt*6);wcam.x+=(me.x-wcam.x)*k;wcam.y+=(me.y-wcam.y)*k;clampCam();
  if((save.story._t=(save.story._t||0)+dt)>2){save.story._t=0;save.story.x=me.x;save.story.y=me.y;persist()}
}
function clampCam(){
  const hw=WW/2/wzoom,hh=WH/2/wzoom;
  wcam.x=MAP.w<hw*2?MAP.w/2:Math.max(hw,Math.min(MAP.w-hw,wcam.x));
  wcam.y=MAP.h<hh*2?MAP.h/2:Math.max(hh-60,Math.min(MAP.h-hh+40,wcam.y));
}

// --- Drawing
function drawPerson(c,p,look,t){
  const {x,y}=p,f=p.face||0,ph=p.moving?Math.sin(p.walk||0):0,bob=p.moving?Math.abs(ph)*1.5:0;
  c.save();c.translate(x,y-bob);
  c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(0,bob,9,3.5,0,0,7);c.fill();
  // legs
  c.fillStyle=look.legs;
  if(f===1||f===3){c.fillRect(-3+ph*3,-9,4,9);c.fillRect(-1-ph*3,-9,4,9)}
  else{c.fillRect(-6,-9+(ph>0?-1:0),5,9);c.fillRect(1,-9+(ph<0?-1:0),5,9)}
  // arms behind when facing away
  const arm=(dx)=>{c.fillStyle=look.top;c.beginPath();c.ellipse(dx,-15,3.2,6,0,0,7);c.fill();c.fillStyle=look.skin;c.beginPath();c.arc(dx,-9.5,2.4,0,7);c.fill()};
  const sw=ph*2.5;
  if(f===2){arm(-9);arm(9)}
  // body
  c.fillStyle=look.top;c.beginPath();c.roundRect(-8,-24,16,16,5);c.fill();
  if(look.extra==='apron'&&f!==2){c.fillStyle='#2f6b5a';c.beginPath();c.roundRect(-6,-21,12,13,3);c.fill()}
  if(f===0||f===1||f===3){c.save();c.translate(0,sw*.3);arm(f===1?3:-9);c.restore();c.save();c.translate(0,-sw*.3);arm(f===3?-3:9);c.restore()}
  // held items
  if(look.extra==='rake'){c.strokeStyle='#8a6a43';c.lineWidth=1.6;c.beginPath();c.moveTo(9,-8);c.lineTo(14,-34);c.stroke();c.strokeStyle='#777';c.beginPath();c.moveTo(10,-36);c.lineTo(18,-32);c.stroke()}
  if(look.extra==='club'){const a=p.swingA||0;c.save();c.translate(0,-12);c.rotate(a);c.strokeStyle='#cfd5cc';c.lineWidth=1.6;c.beginPath();c.moveTo(0,0);c.lineTo(0,22);c.stroke();c.fillStyle='#4b4f4a';c.fillRect(-3,21,7,3);c.restore()}
  // head
  c.fillStyle=look.skin;c.beginPath();c.arc(0,-31,8.5,0,7);c.fill();
  c.fillStyle=look.hair;
  if(f===2){c.beginPath();c.arc(0,-31,8.8,0,7);c.fill()}
  else{c.beginPath();c.arc(0,-33.5,8.6,Math.PI*1.02,Math.PI*1.98);c.fill();
    if(f===1){c.beginPath();c.arc(3,-31,7.8,-Math.PI/2,Math.PI/2);c.fill()}
    if(f===3){c.beginPath();c.arc(-3,-31,7.8,Math.PI/2,Math.PI*1.5);c.fill()}}
  if(look.spiky){c.beginPath();for(let k=-3;k<=3;k++){c.moveTo(k*2.6-2,-37);c.lineTo(k*2.6,-43);c.lineTo(k*2.6+2,-37)}c.fill()}
  if(look.bun){c.beginPath();c.arc(0,-41,4,0,7);c.fill()}
  if(look.beard&&f!==2){c.beginPath();c.arc(f===1?-2:f===3?2:0,-27,6,0,Math.PI);c.fill()}
  // face
  if(f!==2){c.fillStyle='#1d1a17';const ex=f===1?-3:f===3?3:0;
    if(f===0){c.fillRect(-4,-31,2,2.5);c.fillRect(2,-31,2,2.5)}else c.fillRect(ex+(f===1?-1:0),-31,2,2.5);
    if(look.shades){c.fillStyle='#111';if(f===0)c.fillRect(-6,-32,12,3.5);else c.fillRect(f===1?-7:1,-32,6,3.5)}
    c.fillStyle='rgba(225,120,110,.45)';if(f===0){c.beginPath();c.arc(-5,-27.5,1.6,0,7);c.arc(5,-27.5,1.6,0,7);c.fill()}}
  // cap
  if(look.cap){c.fillStyle=look.cap;c.beginPath();c.arc(0,-34,8.8,Math.PI,Math.PI*2);c.fill();
    if(f===0&&!look.flat)c.fillRect(-7,-34,14,3);
    if(f===1)c.fillRect(-12,-35,6,3);if(f===3)c.fillRect(6,-35,6,3);
    if(look.flat){c.beginPath();c.ellipse(0,-35,10,3.5,0,0,7);c.fill()}}
  c.restore();
}
function drawDog(c,p){
  const {x,y}=p,ph=Math.sin(p.walk||0),left=p.face===1,t=performance.now()/1000;
  c.save();c.translate(x,y);if(left)c.scale(-1,1);
  c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(0,0,10,3,0,0,7);c.fill();
  c.fillStyle='#7a5530';c.fillRect(-7+ph,-6,2.5,6);c.fillRect(4-ph,-6,2.5,6);
  c.fillStyle='#c99a5b';c.beginPath();c.ellipse(0,-9,9,5.5,0,0,7);c.fill();
  c.strokeStyle='#c99a5b';c.lineWidth=2.5;c.lineCap='round';c.beginPath();c.moveTo(-8,-11);c.lineTo(-12,-15+Math.sin(t*14)*2);c.stroke();
  c.beginPath();c.arc(9,-14,5.5,0,7);c.fill();
  c.fillStyle='#7a5530';c.beginPath();c.ellipse(7,-18,2.5,4,-.4,0,7);c.fill();
  c.fillStyle='#1d1a17';c.fillRect(10,-15.5,1.8,1.8);c.beginPath();c.arc(14.5,-13,1.5,0,7);c.fill();
  c.restore();
}
function drawBuilding(c,b){
  const wallH=34,roofH=b.h-wallH;
  c.fillStyle='rgba(0,0,0,.22)';c.fillRect(b.x+6,b.y+8,b.w,b.h);
  c.fillStyle=b.roof;c.fillRect(b.x,b.y,b.w,roofH);
  c.fillStyle=b.ridge;c.fillRect(b.x,b.y+roofH/2-2,b.w,4);
  c.strokeStyle='rgba(0,0,0,.12)';c.lineWidth=1;for(let yy=b.y+8;yy<b.y+roofH;yy+=8){c.beginPath();c.moveTo(b.x,yy);c.lineTo(b.x+b.w,yy);c.stroke()}
  c.fillStyle=b.wall;c.fillRect(b.x,b.y+roofH,b.w,wallH);
  c.fillStyle='rgba(0,0,0,.12)';c.fillRect(b.x,b.y+roofH,b.w,4);
  // windows and door
  c.fillStyle='#7fb2c9';for(let wx=b.x+14;wx<b.x+b.w-22;wx+=34){if(Math.abs(wx+9-b.door)<22)continue;c.fillRect(wx,b.y+roofH+10,18,14);c.fillStyle='#ffffff55';c.fillRect(wx,b.y+roofH+10,18,3);c.fillStyle='#7fb2c9'}
  c.fillStyle='#5a3a22';c.fillRect(b.door-9,b.y+roofH+8,18,wallH-8);c.fillStyle='#f2c14e';c.fillRect(b.door+4,b.y+roofH+20,2,2);
  // sign
  c.font='800 10px "Nunito Sans",system-ui,sans-serif';c.textAlign='center';const tw=c.measureText(b.sign).width+12;
  c.fillStyle='#1c3628';c.fillRect(b.door-tw/2,b.y+roofH-14,tw,14);c.fillStyle='#f2c14e';c.fillText(b.sign,b.door,b.y+roofH-4);c.textAlign='left';
}
function drawCar(c,k){
  c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.roundRect(k.x+3,k.y+4,36,62,8);c.fill();
  c.fillStyle=k.c;c.beginPath();c.roundRect(k.x,k.y,36,62,8);c.fill();
  c.fillStyle='#1d2a33';c.beginPath();c.roundRect(k.x+5,k.y+12,26,12,3);c.fill();c.beginPath();c.roundRect(k.x+5,k.y+40,26,10,3);c.fill();
  c.fillStyle='rgba(255,255,255,.25)';c.fillRect(k.x+6,k.y+26,24,12);
  c.fillStyle='#f6e7a1';c.fillRect(k.x+4,k.y+1,7,3);c.fillRect(k.x+25,k.y+1,7,3);
  if(k.sport){c.fillStyle='#111';c.fillRect(k.x+14,k.y,3,62);c.fillRect(k.x+19,k.y,3,62);c.fillStyle='#222';c.fillRect(k.x+3,k.y+58,30,4)}
}
function drawWorld(){
  const d=devicePixelRatio||1,c=wctx,z=wzoom,T=performance.now()/1000;
  c.setTransform(d,0,0,d,0,0);c.fillStyle='#24502c';c.fillRect(0,0,WW,WH);
  c.setTransform(d*z,0,0,d*z,d*(WW/2-wcam.x*z),d*(WH/2-wcam.y*z));
  // grass with mowing stripes
  for(let y=0,i=0;y<MAP.h;y+=36,i++){c.fillStyle=i%2?'#4a8641':'#4f8c46';c.fillRect(0,y,MAP.w,36)}
  // car park
  c.fillStyle='#5d625c';c.fillRect(180,772,380,128);c.strokeStyle='#e9e6dc';c.lineWidth=2;
  for(let x=196;x<=548;x+=50){c.beginPath();c.moveTo(x,784);c.lineTo(x,866);c.stroke()}
  // paths
  c.lineCap='round';c.lineJoin='round';
  for(const P of PATHS){c.beginPath();P.forEach((q,k)=>k?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.strokeStyle='#c2ab72';c.lineWidth=40;c.stroke()}
  for(const P of PATHS){c.beginPath();P.forEach((q,k)=>k?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.strokeStyle='#dcc894';c.lineWidth=34;c.stroke()}
  // 1st tee
  c.fillStyle='#74ba60';c.fillRect(TEEBOX.x,TEEBOX.y,TEEBOX.w,TEEBOX.h);c.fillStyle='#f4f4f0';c.beginPath();c.arc(62,150,3,0,7);c.arc(130,150,3,0,7);c.fill();
  c.fillStyle='#1c3628';c.fillRect(150,92,52,30);c.fillStyle='#f2c14e';c.font='800 9px "Nunito Sans",system-ui,sans-serif';c.fillText('1st',156,104);c.fillStyle='#eef3e4';c.fillText('388 · P4',156,116);
  // practice green
  c.fillStyle='#5fae4f';c.beginPath();c.ellipse(PGREEN.x,PGREEN.y,PGREEN.rx*1.12,PGREEN.ry*1.15,0,0,7);c.fill();
  c.fillStyle='#7ccb66';c.beginPath();c.ellipse(PGREEN.x,PGREEN.y,PGREEN.rx,PGREEN.ry,0,0,7);c.fill();
  for(const [fx,fy] of [[120,505],[190,540],[200,495]]){c.fillStyle='#10150f';c.beginPath();c.arc(fx,fy,2.5,0,7);c.fill();c.strokeStyle='#eef3e4';c.lineWidth=1.2;c.beginPath();c.moveTo(fx,fy);c.lineTo(fx,fy-18);c.stroke();c.fillStyle='#f2c14e';c.beginPath();c.moveTo(fx,fy-18);c.lineTo(fx+9,fy-15);c.lineTo(fx,fy-12);c.fill()}
  // pond
  c.fillStyle='#3a6e44';c.beginPath();c.ellipse(POND.x,POND.y,POND.rx+5,POND.ry+5,0,0,7);c.fill();
  c.fillStyle='#2b77a3';c.beginPath();c.ellipse(POND.x,POND.y,POND.rx,POND.ry,0,0,7);c.fill();
  c.fillStyle='#3b8ebd';c.beginPath();c.ellipse(POND.x-12,POND.y-8,POND.rx*.55,POND.ry*.5,0,0,7);c.fill();
  c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=1.2;for(let k=0;k<3;k++){const r=((T*.4+k/3)%1);c.globalAlpha=1-r;c.beginPath();c.ellipse(POND.x+20,POND.y+10,6+r*18,3+r*8,0,0,7);c.stroke()}c.globalAlpha=1;
  c.fillStyle='#5d9b4c';for(const [lx,ly] of [[470,650],[548,690],[520,708]]){c.beginPath();c.arc(lx,ly,5,.4,Math.PI*2);c.lineTo(lx,ly);c.fill()}
  // flower beds
  for(const b of BEDS){c.fillStyle='#5a3f2a';c.beginPath();c.ellipse(b.x,b.y,b.rx,b.ry,0,0,7);c.fill();
    for(let k=0;k<9;k++){c.fillStyle=['#f2c14e','#ec7a55','#f4f4f0','#c58af0'][k%4];c.beginPath();c.arc(b.x-b.rx+6+k*(b.rx*2-12)/8,b.y+(k%2?-3:3),2.2,0,7);c.fill()}}
  // benches
  for(const b of BENCHES){c.fillStyle='#8a6a43';c.fillRect(b.x,b.y,b.w,b.h);c.fillStyle='#6b5233';c.fillRect(b.x,b.y,b.w,3)}
  // depth-sorted things: buildings, trees, cars, people
  const items=[];
  for(const b of BUILDINGS)items.push({y:b.y+b.h,f:()=>drawBuilding(c,b)});
  for(const k of CARS)items.push({y:k.y+62,f:()=>drawCar(c,k)});
  for(const t of WTREES)items.push({y:t.y+t.r*.3,f:()=>{c.fillStyle='rgba(10,30,15,.3)';c.beginPath();c.arc(t.x+4,t.y+6,t.r,0,7);c.fill();
    c.fillStyle='#5a3f2a';c.fillRect(t.x-3,t.y,6,t.r*.5);c.fillStyle='#2a5d33';c.beginPath();c.arc(t.x,t.y-t.r*.3,t.r,0,7);c.fill();c.fillStyle='#377242';c.beginPath();c.arc(t.x-t.r*.3,t.y-t.r*.55,t.r*.5,0,7);c.fill()}});
  NPC.toby.swingA=Math.max(0,Math.sin(T*1.6))*2.2-.3;
  for(const n of NPCS)items.push({y:n.y,f:()=>n.dog?drawDog(c,n):drawPerson(c,n,n.look)});
  items.push({y:me.y,f:()=>drawPerson(c,me,PLAYER_LOOK)});
  items.sort((a,b)=>a.y-b.y).forEach(i=>i.f());
  // name tags and quest markers
  const f=SF(),near=nearNpc();
  c.font='800 9px "Nunito Sans",system-ui,sans-serif';c.textAlign='center';
  for(const n of NPCS){
    const quest=(n.id==='hartley'&&!f.metCaptain)||(n.id==='toby'&&f.metCaptain&&!f.beatToby)||(n.id==='dot'&&f.beatToby&&!f.beatDot)||(n.id==='marcus'&&f.beatDot&&!f.beatMarcus)||(n.id==='duncan'&&f.beatMarcus&&!f.champion);
    const top=n.dog?n.y-26:n.y-50;
    const tag=n===near||Math.hypot(n.x-me.x,n.y-me.y)<90;
    if(tag){const w=c.measureText(n.name).width+10;c.fillStyle='rgba(14,29,21,.8)';c.beginPath();c.roundRect(n.x-w/2,top-14,w,13,5);c.fill();c.fillStyle='#eef3e4';c.fillText(n.name,n.x,top-4)}
    if(quest){const b=Math.sin(T*4)*2,qy=top-(tag?24:8)+b;c.fillStyle='#f2c14e';c.beginPath();c.arc(n.x,qy,7,0,7);c.fill();c.fillStyle='#1d1a0e';c.font='900 11px "Nunito Sans",system-ui,sans-serif';c.fillText('!',n.x,qy+4);c.font='800 9px "Nunito Sans",system-ui,sans-serif'}
  }
  c.textAlign='left';
  // where you're walking to
  if(target&&!dlg&&!pendingTalk){c.strokeStyle='rgba(242,193,78,.8)';c.lineWidth=1.5;c.beginPath();c.ellipse(target.x,target.y,7,3.5,0,0,7);c.stroke()}
}
function worldFrame(dt){worldStep(dt);drawWorld()}

/* ---------- Main menu ---------- */
let pnpCount=2, pnpNames=['Player 1','Player 2','Player 3','Player 4'];
try{const n=JSON.parse(localStorage.getItem('fsl-names'));if(Array.isArray(n)&&n.length===4)pnpNames=n;const c=+localStorage.getItem('fsl-pcount');if(c>=2&&c<=4)pnpCount=c}catch(e){}
function openMenu(screen){
  if(state==='flight'||state==='roll')return;
  $('#sheet').hidden=true;$('#pass').hidden=true;$('#menu').hidden=false;
  if(worldOn){save.story.x=me.x;save.story.y=me.y;persist()}
  $('#world').hidden=true;worldOn=false;
  const b=$('#menuBody');
  if(screen==='pnp'){
    b.innerHTML=`<div class="screen-h"><div class="sheet-title">Pass &amp; play</div><button id="mBack" class="ghost">Back</button></div>
      <div class="blurb">How many players?</div>
      <div class="seg">${[2,3,4].map(n=>`<button data-n="${n}" aria-pressed="${n===pnpCount}">${n}</button>`).join('')}</div>
      <div class="blurb">Names</div>
      ${[0,1,2,3].map(k=>`<div class="prow"${k>=pnpCount?' hidden':''}><span class="dot" style="background:${PCOLS[k]}"></span><input id="pname${k}" maxlength="14" value="${esc(pnpNames[k])}" aria-label="Player ${k+1} name" autocomplete="off"></div>`).join('')}
      <div class="blurb">Everyone plays the Clubhouse set, so it's a fair fight. Tee shots go in order, then whoever's furthest from the hole plays next. Max score on a hole is par + 5. No coins or XP.</div>
      <button id="mGo" class="mbtn pri"><b>Tee off</b><span>9 holes · par ${COURSE_PAR}</span></button>`;
    b.querySelectorAll('.seg button').forEach(x=>x.onclick=()=>{pnpCount=+x.dataset.n;keepNames();openMenu('pnp')});
    $('#mBack').onclick=()=>{keepNames();openMenu('home')};
    $('#mGo').onclick=()=>{keepNames();const names=pnpNames.slice(0,pnpCount).map((n,k)=>n.trim()||`Player ${k+1}`);startGame({mode:'pnp',names})};
    return;
  }
  if(screen==='backup'){
    b.innerHTML=`<div class="screen-h"><div class="sheet-title">Backup &amp; restore</div><button id="mBack" class="ghost">Back</button></div>
      <div class="blurb">Your save code holds your clubs, coins, kits, story progress and best round. Copy it, then paste it into Restore on the other phone or in the installed app.</div>
      <textarea id="bkOut" class="bk" readonly aria-label="Your save code">${esc(makeBackup())}</textarea>
      <div class="acts"><button id="bkCopy" class="sbtn pri">Copy save code</button></div>
      <div class="group-h">Restore</div>
      <textarea id="bkIn" class="bk" placeholder="Paste a save code here" aria-label="Paste a save code"></textarea>
      <div class="acts"><button id="bkGo" class="sbtn">Restore</button></div>
      <div id="bkMsg" class="blurb"></div>`;
    $('#mBack').onclick=()=>openMenu('home');
    $('#bkCopy').onclick=()=>{const t=$('#bkOut');const ok=()=>{$('#bkMsg').textContent='Copied. Paste it into Restore on the other device.'};
      try{navigator.clipboard.writeText(t.value).then(ok,()=>{t.select();$('#bkMsg').textContent='Copy blocked here. The code is selected, so copy it manually.'})}catch(e){t.select();$('#bkMsg').textContent='The code is selected, so copy it manually.'}};
    let armed=false;
    $('#bkGo').onclick=()=>{
      const code=$('#bkIn').value.trim();if(!code){$('#bkMsg').textContent='Paste a save code first.';return}
      let data;try{data=JSON.parse(decodeURIComponent(escape(atob(code))));if(!data||!data.save||!data.save.owned)throw 0}catch(e){$('#bkMsg').textContent='That code doesn\'t look right. Copy the whole code and try again.';return}
      if(!armed){armed=true;$('#bkGo').textContent='Tap again to replace this save';$('#bkMsg').textContent='This replaces the progress on this device.';return}
      try{for(const [k,v] of Object.entries(data.ls||{}))localStorage.setItem(k,v)}catch(e){}
      save=data.save;persist();best=data.best||null;try{if(best)localStorage.setItem('fsl-best-round',best)}catch(e){}
      me.x=save.story?save.story.x:320;me.y=save.story?save.story.y:840;
      $('#bkGo').textContent='Restore';armed=false;$('#bkMsg').textContent=`Restored: ${save.coins} coins, ${DEFS.filter(d=>save.owned[d.id]).length} clubs.`;
    };
    return;
  }
  if(screen==='practice'){
    b.innerHTML=`<div class="screen-h"><div class="sheet-title">Practice</div><button id="mBack" class="ghost">Back</button></div>
      <div class="blurb">Pick a hole. Your own bag, unlimited undo, no coins or XP.</div>
      ${HOLES.map((h,k)=>`<button class="hrow" data-h="${k}"><span class="n">${k+1}</span><span class="t">${esc(h.name)}</span><span class="m">Par ${h.par} · ${h.len} yds</span></button>`).join('')}`;
    $('#mBack').onclick=()=>openMenu('home');
    b.querySelectorAll('.hrow').forEach(x=>x.onclick=()=>startGame({mode:'practice',hole:+x.dataset.h}));
    return;
  }
  const resume=gameOn&&state!=='done';
  const where=mode==='rival'&&rival?`${rival.title||rival.name+' match'} · hole ${holeIdx-rival.s+1} of ${rival.holes} · ${rivalLine()}`:mode==='practice'?`Practice · hole ${holeIdx+1}`:mode==='pnp'?`Pass & play · hole ${holeIdx+1} · ${players.length} players`:`Solo round · hole ${holeIdx+1} · ${toPar(playedStrokes()-playedPar())}`;
  b.innerHTML=`<div class="menu-hero"><div class="k">A golf RPG</div><div class="menu-title">Fairway<br><span>Tales</span></div><div class="blurb">9 holes · par ${COURSE_PAR}${best?` · Best solo round ${best}`:''}</div></div>
    ${resume?`<button id="mResume" class="mbtn pri"><b>Resume</b><span>${esc(where)}</span></button>`:''}
    <button id="mStory" class="mbtn"><b>Story · Chapter 1</b><span>${SF().champion?'Ashby Green Club Champion. Chapter 2 coming soon.':SF().beatToby?`Ashby Green Golf Club. ${['beatToby','beatDot','beatMarcus','champion'].filter(k=>SF()[k]).length} of 4 rivals beaten.`:SF().intro?'Back to Ashby Green Golf Club.':'Walk the club, meet the members, take on your first rival.'}</span></button>
    <button id="mSolo" class="mbtn"><b>Solo round</b><span>9 holes with your own bag. Earn coins and club XP.</span></button>
    <button id="mPnp" class="mbtn"><b>Pass &amp; play</b><span>2 to 4 players on one phone. Everyone on the Clubhouse set.</span></button>
    <button id="mPractice" class="mbtn"><b>Practice</b><span>Pick any hole. Unlimited undo, no rewards.</span></button>
    <button id="mBag" class="mbtn"><b>Bag &amp; pro shop</b><span>${save.coins} coins · ${save.kits} kits · ${DEFS.filter(d=>save.owned[d.id]).length} of ${DEFS.length} clubs</span></button>
    <button id="mBackup" class="mbtn"><b>Backup &amp; restore</b><span>Move your clubs, coins and story to another phone or app.</span></button>
    <div class="blurb" style="text-align:center;margin-top:8px">© 2026 kralnu90. All rights reserved.</div>`;
  if(resume)$('#mResume').onclick=()=>{$('#menu').hidden=true;if(players.length>1&&state==='ready')showPass(false)};
  $('#mStory').onclick=()=>openWorld();
  $('#mSolo').onclick=()=>startGame({mode:'solo'});
  $('#mPnp').onclick=()=>openMenu('pnp');
  $('#mPractice').onclick=()=>openMenu('practice');
  $('#mBag').onclick=()=>openSheet('bag',true);
  $('#mBackup').onclick=()=>openMenu('backup');
}
function makeBackup(){
  const ls={};try{for(const k of ['fsl-preview','fsl-names','fsl-pcount']){const v=localStorage.getItem(k);if(v!=null)ls[k]=v}}catch(e){}
  return btoa(unescape(encodeURIComponent(JSON.stringify({v:1,save,best,ls}))));
}
function keepNames(){for(let k=0;k<4;k++){const el=$('#pname'+k);if(el)pnpNames[k]=el.value}try{localStorage.setItem('fsl-names',JSON.stringify(pnpNames));localStorage.setItem('fsl-pcount',pnpCount)}catch(e){}}
$('#menuBtn').onclick=()=>openMenu('home');

/* ---------- Loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='flight'){flight.t+=dt/flight.dur;if(flight.t>=1){flight.t=1;land()}else trace.push(flightPos(flight.t))}
  else if(state==='roll'){for(let i=0;i<6&&state==='roll';i++)stepRoll(dt*1.4/6)}
  if(worldOn)worldFrame(dt);else{updateCam(dt);draw()}
  requestAnimationFrame(frame);
}
startGame({mode:'solo'});gameOn=false;resize();updateCam(0,true);openMenu('home');requestAnimationFrame(frame);
})();
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
